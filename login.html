<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login | Rohit Enterprises</title>
<link rel="stylesheet" href="/output.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>

</head>
<body class="bg-surface-container-low flex flex-col items-center justify-center min-h-screen font-label-md">
    <div class="fixed top-4 right-4 flex items-center space-x-2 z-50">
        <button id="lang-en" class="font-label-md text-label-md text-primary font-bold cursor-pointer transition">EN</button>
        <span class="text-outline-variant">|</span>
        <button id="lang-mr" class="font-label-md text-label-md text-on-surface-variant cursor-pointer transition">MR</button>
    </div>
    <div class="mb-8 text-center">
        <h1 class="text-3xl font-bold font-headline-md text-primary tracking-tight" data-i18n="Rohit Enterprises">Rohit Enterprises</h1>
    </div>
    <div class="bg-surface p-10 rounded border border-outline-variant shadow-lg max-w-sm w-full">
        <h2 class="font-headline-md text-2xl font-bold text-primary mb-6 text-center" data-i18n="Admin Access">Admin Access</h2>
        <form id="loginForm" class="flex flex-col gap-4">
            <input type="email" id="email" placeholder="Admin Email" class="p-3 border rounded border-outline-variant focus:outline-primary" required>
            <input type="password" id="password" placeholder="Password" class="p-3 border rounded border-outline-variant focus:outline-primary" required>
            <p id="errorMsg" class="text-error font-label-sm hidden text-center mt-2"></p>
            <button type="submit" class="bg-primary text-on-primary py-3 rounded font-label-md hover:opacity-90 transition-all shadow mt-2" data-i18n="Sign In">Sign In</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { firebaseConfig } from "./firebase-config.js";

        // Check if config is placeholder
        if(firebaseConfig.apiKey === "YOUR_API_KEY") {
            const err = document.getElementById('errorMsg');
            err.textContent = "Please add your Firebase Config to firebase-config.js";
            err.classList.remove('hidden');
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const err = document.getElementById('errorMsg');
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = '/admin'; // Navigate to admin route
            } catch (error) {
                console.error(error);
                err.textContent = error.message || 'Login failed. Check your credentials.';
                err.classList.remove('hidden');
            }
        });
    </script>
    <script src="/translations.js"></script>
</body>
</html>
