<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Our Work | Pranav Enterprises</title>
<link rel="stylesheet" href="/output.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500;600;700;800;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            background-color: #f7f9fb;
            color: #191c1e;
        }
        .page-title {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: 3rem;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
</style>
</head>
<body class="font-body-md text-body-md overflow-x-hidden">
<header class="w-full top-0 sticky z-50 bg-surface dark:bg-on-background border-b border-outline-variant dark:border-outline">
<nav class="flex justify-between items-center h-16 px-4 md:px-margin-desktop max-w-container-max mx-auto">
<div class="flex items-center gap-3">
<img src="/logo.png" alt="R Logo" class="w-9 h-9 rounded-full object-cover shadow-sm"/>
<span class="text-headline-sm font-bold text-on-background dark:text-surface" style="font-family: 'Playfair Display', serif;" data-i18n="Pranav Enterprises">Pranav Enterprises</span>
</div>
<div class="hidden md:flex items-center space-x-8">
    <a href="/" class="font-body-md text-on-surface-variant hover:text-primary transition" data-i18n="Products">Products</a>
    <a href="/work.html" class="font-body-md text-primary font-bold border-b-2 border-primary pb-1" data-i18n="Work">Work</a>
</div>
<div class="flex items-center space-x-2">
    <button id="lang-en" class="font-label-md text-label-md text-primary font-bold cursor-pointer transition">EN</button>
    <span class="text-outline-variant">|</span>
    <button id="lang-mr" class="font-label-md text-label-md text-on-surface-variant cursor-pointer transition">MR</button>
</div>
</nav>
</header>
<main>
<section class="py-12 md:py-20 px-4 md:px-margin-desktop max-w-container-max mx-auto text-center">
    <h1 class="page-title mb-4" data-i18n="Our Work">Our Work</h1>
    <p class="font-body-md text-on-surface-variant max-w-xl mx-auto text-lg">
        Explore some of the best projects, events, and highlights from Pranav Enterprises.
    </p>
</section>

<section class="py-12 bg-surface-container-low min-h-screen">
<div class="px-4 md:px-margin-desktop max-w-container-max mx-auto">
    <div id="workGrid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <p class="col-span-full text-center text-on-surface-variant font-body-md py-12">Loading work...</p>
    </div>
</div>
</section>

</main>
<footer class="w-full bg-surface-container-low border-t border-outline-variant">
<div class="flex flex-col md:flex-row justify-between items-center py-12 px-4 md:px-margin-desktop max-w-container-max mx-auto">
<div class="mb-8 md:mb-0">
<div class="text-headline-sm font-headline-sm font-bold text-on-background mb-2">Pranav Enterprises</div>
<p class="font-label-md text-label-md text-on-surface-variant">© 2024 Pranav Enterprises. All rights reserved.</p>
</div>
</div>
</footer>

<!-- Details Modal -->
<div id="detailsModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-[100] p-4">
    <div class="bg-surface rounded-xl shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto relative flex flex-col md:flex-row">
        <button onclick="closeDetailsModal()" class="absolute top-4 right-4 text-on-surface bg-surface-container-highest hover:bg-outline-variant p-2 rounded-full transition-colors z-10">
            <span class="material-symbols-outlined">close</span>
        </button>
        <div class="md:w-1/2 w-full">
            <img id="modalImage" src="" alt="Work" class="w-full h-full object-cover min-h-[300px]"/>
        </div>
        <div class="md:w-1/2 w-full p-8 flex flex-col justify-center">
            <h2 id="modalTitle" class="font-headline-md text-3xl text-on-background mb-4"></h2>
            <p id="modalDesc" class="font-body-md text-on-surface-variant leading-relaxed"></p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    if(firebaseConfig.apiKey !== "YOUR_API_KEY") {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let allWorks = [];

        async function renderWorks() {
            const grid = document.getElementById('workGrid');
            grid.innerHTML = '';
            
            if(allWorks.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-12">No work items available at the moment.</p>';
                return;
            }

            const currentLang = window.currentLang || 'en';
            const detailsText = currentLang === 'mr' ? 'तपशील पहा' : 'View Details';

            allWorks.forEach(w => {
                const card = document.createElement('div');
                card.className = 'group bg-surface border border-outline-variant rounded overflow-hidden flex flex-col transition-all hover:shadow-xl hover:-translate-y-1';
                
                const displayTitle = currentLang === 'mr' && w.title_mr ? w.title_mr : w.title_en;
                const displayDesc = currentLang === 'mr' && w.desc_mr ? w.desc_mr : w.desc_en;

                card.innerHTML = `
                    <div class="h-64 overflow-hidden relative">
                        <img class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" src="${w.image_url}" alt="img"/>
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <h3 class="font-headline-sm text-2xl text-on-background mb-3">${displayTitle}</h3>
                        <p class="font-body-md text-on-surface-variant mb-6 line-clamp-3">${displayDesc}</p>
                        <button class="mt-auto border border-primary text-primary hover:bg-primary hover:text-on-primary py-2 px-6 rounded text-label-md font-bold tracking-widest uppercase transition-colors self-start" onclick="openDetailsModal('${w.id}')">${detailsText}</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function fetchWorks() {
            try {
                const q = query(collection(db, "works"));
                const querySnapshot = await getDocs(q);
                allWorks = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if(data.status === 'Published') {
                        allWorks.push({ id: doc.id, ...data });
                    }
                });
                
                renderWorks();
            } catch(e) { console.error('Error fetching works', e); }
        }
        
        window.addEventListener('languageChanged', renderWorks);

        window.openDetailsModal = function(id) {
            const work = allWorks.find(w => w.id === id);
            if(!work) return;
            const currentLang = window.currentLang || 'en';
            
            document.getElementById('modalImage').src = work.image_url;
            document.getElementById('modalTitle').textContent = currentLang === 'mr' && work.title_mr ? work.title_mr : work.title_en;
            document.getElementById('modalDesc').textContent = currentLang === 'mr' && work.desc_mr ? work.desc_mr : work.desc_en;
            
            document.getElementById('detailsModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        window.closeDetailsModal = function() {
            document.getElementById('detailsModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        fetchWorks();
    } else {
        document.getElementById('workGrid').innerHTML = '<p class="col-span-full text-center text-error font-bold py-12">Firebase Configuration is Missing.</p>';
    }
</script>
<script src="/translations.js"></script>
</body>
</html>
